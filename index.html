                    { text: "The printer prints out a paper receipt", isCorrect: false, rationale: "This is unrelated." }
                ]
            },
            {
                question: "Which summary best encapsulates network security and authentication (4.2.1 to 4.2.3) in IGCSE ICT?",
                options: [
                    { text: "Protecting data transfer requires encryption and secure protocols (HTTPS), while user authentication relies on strong passwords, multi-factor authentication (MFA), and biometrics to prevent unauthorized access", isCorrect: true, rationale: "Secure data transfer relies on encryption, and robust access control combines passwords, multi-factor methods, and biometrics." },
                    { text: "Network security is achieved solely by turning off computer monitors and unplugging Wi-Fi routers", isCorrect: false, rationale: "Security requires active encryption and authentication controls." },
                    { text: "Authentication is exclusively performed by physical metal door keys and paper filing cabinets", isCorrect: false, rationale: "Modern IT systems use digital passwords, tokens, and biometrics." },
                    { text: "Security issues regarding data transfer do not exist in modern computer networks", isCorrect: false, rationale: "Cybersecurity threats like sniffing, malware, and phishing are major network challenges." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const questionBox = document.getElementById("question-box");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultsContainer = document.getElementById("results-container");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");
            
            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionBox.textContent = q.question;

            // Shuffle options array randomly so correct answer is not always first
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = "";
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(opt, shuffledOptions);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, shuffledOptions) {
            if (answered) return;
            answered = true;

            const allOptionButtons = optionsContainer.children;

            shuffledOptions.forEach((opt, idx) => {
                allOptionButtons[idx].disabled = true;
                if (opt.isCorrect) {
                    allOptionButtons[idx].classList.add("correct");
                } else if (opt === selectedOpt && !selectedOpt.isCorrect) {
                    allOptionButtons[idx].classList.add("incorrect");
                }
            });

            feedbackBox.classList.remove("hidden");
            if (selectedOpt.isCorrect) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                feedbackBox.className = "feedback-box correct-feedback";
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOpt.rationale}`;
            } else {
                feedbackBox.className = "feedback-box incorrect-feedback";
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOpt.rationale}`;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = "Next Question";
            } else {
                nextBtn.textContent = "View Results";
            }
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                quizContainer.classList.add("hidden");
                resultsContainer.classList.remove("hidden");
                finalScore.textContent = `You scored ${score} out of ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultsContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
</body>
</html>
